# Base configuration for Clash Mi.
# Clash Mi manages local HTTP/SOCKS listeners itself, so this template
# intentionally omits port, socks-port, mixed-port, and bind-address.
allow-lan: false
ipv6: false
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  listen: 0.0.0.0:53
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - +.sankuai.com
    - +.sankuai.info
    - +.51ping.com
    - time.*.com
    - ntp.*.com
    - +.market.xiaomi.com
    - localhost.ptlogin2.qq.com
    - "*.msftncsi.com"
    - www.msftconnecttest.com
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver-policy:
    "+.sankuai.com":
      - system
    "+.sankuai.info":
      - system
    "+.51ping.com":
      - system
  proxy-server-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  fallback:
    - 8.8.8.8
    - 1.1.1.1
    - tls://1.0.0.1:853
    - tls://dns.google:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

# 域名嗅探：让 UDP/QUIC 443 流量也能提取 SNI 域名，命中 DOMAIN 规则
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  skip-domain:
    - +.sankuai.com
    - +.sankuai.info
    - +.51ping.com
    - +.local
    - +.lan
  sniff:
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443]
  force-domain:
    - +.facebook.com
    - +.meta.ai
    - +.fbcdn.net
